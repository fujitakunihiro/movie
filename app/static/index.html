<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="お気に入りの映像を、いつでも楽しめるパーソナルビデオライブラリ。">
  <title>ビデオライブラリ</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.8c0-.77.84-1.25 1.5-.87l9.32 5.36a1 1 0 0 1 0 1.74L9.5 17.39A1 1 0 0 1 8 16.52V5.8Z" fill="currentColor"/></svg>
        </span>
        <div>
          <p class="eyebrow">PERSONAL LIBRARY</p>
          <h1>ビデオライブラリ</h1>
        </div>
      </div>
      <button id="refresh" class="icon-button" aria-label="再読み込み" title="再読み込み">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="intro" aria-label="ライブラリの紹介">
      <h2>映像を、もっと心地よく。</h2>
      <p>あなたのコレクションを、いつでも好きな画面で。</p>
    </section>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="パンくずリスト"></nav>
    <p id="status" class="status" role="status"></p>
    <section id="folders-section" class="section" hidden>
      <div class="section-heading"><h2 class="section-title">フォルダ</h2><span id="folder-count" class="count"></span></div>
      <div id="folders" class="folder-grid"></div>
    </section>
    <section id="videos-section" class="section" hidden>
      <div class="section-heading"><h2 class="section-title">動画</h2><span id="video-count" class="count"></span></div>
      <div id="videos" class="video-list"></div>
    </section>
    <p id="empty" class="empty" hidden>このフォルダに動画やサブフォルダはありません。</p>

    <section id="player-panel" class="player-panel" hidden>
      <div class="player-heading">
        <div><p class="eyebrow">NOW PLAYING</p><h2 id="player-title"></h2></div>
        <button id="close-player" class="icon-button" aria-label="プレーヤーを閉じる"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
      <video id="player" playsinline preload="metadata"></video>
      <div class="transport" aria-label="再生コントロール">
        <button id="play-pause" class="transport-button" type="button" aria-label="準備中" disabled>準備中…</button>
        <span class="time-readout"><span id="current-time">00:00</span><span class="time-divider">/</span><span id="total-time">--:--</span></span>
        <input id="seek" class="seek" type="range" min="0" max="0" step="1" value="0" aria-label="再生位置" disabled>
        <label class="volume-control" for="volume">音量<input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量"></label>
      </div>
      <div class="player-actions">
        <label for="quality">画質</label>
        <select id="quality" aria-label="画質"><option value="auto">自動（通信状況）</option></select>
        <label for="speed">再生速度</label>
        <select id="speed" aria-label="再生速度">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
        </select>
        <button id="fullscreen" class="secondary-button">全画面表示</button>
      </div>
    </section>
    <footer>動画ファイルは読み取り専用で配信されます。</footer>
  </main>
  <script src="/static/hls.min.js"></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
